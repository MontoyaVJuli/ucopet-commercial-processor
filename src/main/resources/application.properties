spring.application.name=ucopet-commercial-processor

spring.config.import=classpath:commercial.properties
server.port=8082

# Configuración del consumidor RabbitMQ
spring.rabbitmq.listener.simple.auto-startup=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto

# Reintentos al procesar mensajes
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0

spring.datasource.url=jdbc:postgresql://localhost:5432/ucopetdb
spring.datasource.username=postgres
spring.datasource.password=11ospinarroyave
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect